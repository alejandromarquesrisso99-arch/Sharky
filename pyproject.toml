[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharky-brain"
version = "1.0.0"
description = "Firma de inversión y Family Office digital autónomo vinculado a Obsidian con gestión departamental y supervivencia de capital"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alejandro Marqués" }
]
keywords = ["investment", "family-office", "hedge-fund", "ai", "claude", "obsidian", "finance", "trading", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "anthropic>=0.40.0",
    "yfinance>=0.2.40",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "schedule>=1.2.0",
]

[project.scripts]
sharky = "sharky.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sharky*"]
exclude = ["vault*", "scripts*", "tests*"]
