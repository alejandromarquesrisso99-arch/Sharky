[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharky-brain"
version = "1.0.0"
description = "Cerebro digital autónomo de inversión vinculado a Obsidian con instinto de supervivencia"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alejandro Marqués" }
]
dependencies = [
    "anthropic>=0.40.0",
    "yfinance>=0.2.40",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "schedule>=1.2.0"
]

[project.scripts]
sharky = "sharky.cli:main"
